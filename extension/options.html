<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplyPilot Settings</title><style>body{font-family:system-ui;max-width:720px;margin:auto;padding:20px;background:#0b1020;color:#eef2ff}label{display:block;margin-top:14px;font-weight:700}input,textarea{width:100%;box-sizing:border-box;margin-top:6px;padding:10px;border-radius:8px;border:1px solid #303b59;background:#11182b;color:#fff}button{margin-top:16px;padding:11px 16px;border:0;border-radius:8px;background:#6d5dfc;color:#fff;font-weight:700}.note{color:#9aa6c1;font-size:13px}.ok{color:#74e0a0}</style></head><body><h1>ApplyPilot Settings</h1><p class="note">Your profile is stored in Firefox extension storage. For a private/local build, you can store your Groq key here. Do not publish an extension containing a shared key.</p><label>Groq API key<input id="key" type="password" autocomplete="off"></label><label>Groq model<input id="model" value="llama-3.3-70b-versatile"></label><label>Full name<input id="name"></label><label>Email<input id="email" type="email"></label><label>Phone<input id="phone"></label><label>LinkedIn<input id="linkedin"></label><label>GitHub<input id="github"></label><label>Portfolio<input id="portfolio"></label><label>City<input id="city"></label><label>State<input id="state"></label><label>Country<input id="country" value="India"></label><label>University / College<input id="university"></label><label>Degree<input id="degree"></label><label>Graduation year<input id="year" type="number"></label><label>Skills<textarea id="skills" rows="4" placeholder="Python, JavaScript, TypeScript, SQL, Node.js..."></textarea></label><label>Projects<textarea id="projects" rows="4" placeholder="ForgeAI, Flashcall..."></textarea></label><button id="save">Save settings</button><span id="status"></span><script src="options.js"></script></body></html>
